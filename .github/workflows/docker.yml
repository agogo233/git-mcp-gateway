name: Docker

on:
  push:
    branches: [master, main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Build & Push GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Pinned to commit SHAs of the referenced major-version tags
      # (supply-chain hardening; re-check on version bumps).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Metadata (gateway)
        id: meta_gw
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Metadata (session)
        id: meta_sess
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/git-mcp-session
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build gateway (load)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile.gateway
          push: false
          load: true
          tags: git-mcp-gateway:ci
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          cache-from: type=gha,mode=max
          cache-to: type=gha,mode=max

      - name: Build session (load)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile.session
          push: false
          load: true
          tags: git-mcp-session:ci
          cache-from: type=gha,mode=max
          cache-to: type=gha,mode=max

      - name: Smoke test gateway
        run: |
          set -e
          export GIT_MCP_MASTER_KEY=$(openssl rand -base64 32)
          HASH=$(docker run --rm git-mcp-gateway:ci keytool hash -t ci-test-token)
          HASH2=$(docker run --rm git-mcp-gateway:ci keytool hash -t ci-admin-token)
          mkdir -p ci-cfg
          cat > ci-cfg/server.yaml <<EOF
          server:
            addr: ":8443"
            session_image: git-mcp-session:ci
            socket_dir: /tmp/gmcp/agents
            audit_file: /tmp/gmcp/audit.jsonl
          EOF
          cat > ci-cfg/users.yaml <<EOF
          users:
            alice:
              token_hash: "$HASH"
              name: Alice
              email: alice@example.com
          admin_token_hash: "$HASH2"
          EOF
          cat > ci-cfg/grants.yaml <<EOF
          credentials:
            k1:
              repo: test/repo
              readonly: false
              key_file: /keys/k1.age
          grants:
            - user: alice
              repo: test/repo
              actions: [read, clone, push]
              credential: k1
          EOF
          cat > ci-cfg/repos.yaml <<EOF
          workspace_root: /tmp/gmcp/ws
          repos:
            test/repo:
              github: test/repo
          EOF
          docker run -d --name gw -e GIT_MCP_MASTER_KEY -v "$PWD/ci-cfg:/etc/git-mcp-gateway:ro" -p 18443:8443 git-mcp-gateway:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18443/healthz | grep -q '"version"'; then
              curl -s http://127.0.0.1:18443/healthz
              docker rm -f gw >/dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs gw
          docker rm -f gw >/dev/null || true
          exit 1

      - name: Smoke test session image (must contain no credentials)
        run: |
          set -e
          docker run --rm git-mcp-session:ci sh -c 'git --version && ssh -V && test -s /home/gitmcp/.ssh/known_hosts'
          MATCHES=$(docker run --rm git-mcp-session:ci sh -c 'find / -xdev -type f \( -name "id_ed25519" -o -name "id_rsa" -o -name "id_ecdsa" -o -name "*.age" -o -name "authorized_keys" \) 2>/dev/null' || true)
          if [ -n "$MATCHES" ]; then
            echo "session image must not contain credential files:"
            echo "$MATCHES"
            exit 1
          fi
          echo "session image credential scan passed"

      - name: Push gateway
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile.gateway
          push: true
          tags: ${{ steps.meta_gw.outputs.tags }}
          labels: ${{ steps.meta_gw.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          cache-from: type=gha,mode=max

      - name: Push session
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile.session
          push: true
          tags: ${{ steps.meta_sess.outputs.tags }}
          labels: ${{ steps.meta_sess.outputs.labels }}
          cache-from: type=gha,mode=max

      - name: Show image sizes
        run: docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}" | head -5

  cleanup:
    name: Cleanup old runs & packages
    runs-on: ubuntu-latest
    needs: docker
    if: always() && github.event_name != 'workflow_dispatch'
    timeout-minutes: 5
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@b3018382ca039b53d238908238bd35d1fb14f8ee # v2.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          workflow: docker.yml
          retain_days: 30
          keep_minimum_runs: 10

      - name: Delete old untagged GHCR packages (gateway)
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: git-mcp-gateway
          package-type: container
          min-versions-to-keep: 0
          delete-only-untagged-versions: true

      - name: Delete old untagged GHCR packages (session)
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: git-mcp-session
          package-type: container
          min-versions-to-keep: 0
          delete-only-untagged-versions: true
